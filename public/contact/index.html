<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Us — Phoenix Restored Church Worldwide</title>
    <meta
      name="description"
      content="Get in touch with Phoenix Restored Church Worldwide — Bible studies, church visits, and questions welcome."
    />
    <meta property="og:title" content="Contact Us — Phoenix RCW" />
    <meta
      property="og:description"
      content="Get in touch with Phoenix Restored Church Worldwide."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/logo.png" />
    <link rel="icon" href="/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/intl-tel-input@23.0.12/build/css/intlTelInput.css"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="bg"></div>
    <div class="bg-overlay"></div>

    <header class="site-header">
      <nav class="site-nav text-center">
        <a href="/">Home</a>
        <a href="/sermons/">Sermons</a>
        <a
          href="https://www.paypal.com/donate/?hosted_button_id=G4URRR3ZKY7SS"
          target="_blank"
        >
          Donate
        </a>
        <a href="/contact/" class="active">Contact</a>
      </nav>
    </header>

    <main class="form-page">
      <div class="card form-card pb-0">
        <h1 class="text-center">Contact Us</h1>
        <p class="subtitle">
          We'd love to hear from you. Send us a note and someone from our team
          will reach out.
        </p>

        <form id="contact-form" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              autocomplete="name"
              required
            />
            <span class="error" data-error-for="name"></span>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            />
            <span class="error" data-error-for="email"></span>
          </div>

          <div class="field">
            <label for="phone">Phone</label>
            <input
              type="tel"
              pattern="[0-9]*"
              id="phone"
              name="phone"
              autocomplete="tel"
            />
            <span class="error" data-error-for="phone"></span>
          </div>

          <fieldset class="field interests">
            <legend>I am interested in&hellip;</legend>
            <label class="check"
              ><input
                type="checkbox"
                name="interests"
                value="personalized Bible study"
              />
              <span>Personal Bible study</span></label
            >
            <label class="check"
              ><input
                type="checkbox"
                name="interests"
                value="small group Bible study"
              />
              <span>Small group Bible study</span></label
            >
            <label class="check"
              ><input
                type="checkbox"
                name="interests"
                value="finding a church"
              />
              <span>Finding a church</span></label
            >
            <label class="check"
              ><input type="checkbox" name="interests" value="has questions" />
              <span>I have some questions</span></label
            >
          </fieldset>

          <div class="field">
            <label for="comments">Questions or comments</label>
            <textarea id="comments" name="comments" rows="5"></textarea>
          </div>

          <div class="text-center mt-3 mb-3">
            <button type="submit" class="btn primary" id="submit-btn">
              Send message
            </button>
          </div>
          <p
            class="form-status"
            id="form-status"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="socials">
        <a
          href="https://www.instagram.com/rcw.phx?utm_source=qr"
          target="_blank"
          rel="noopener"
          aria-label="Instagram"
        >
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle
              cx="17.5"
              cy="6.5"
              r="1"
              fill="currentColor"
              stroke="none"
            />
          </svg>
        </a>
        <a
          href="https://www.youtube.com/@RCWPhoenix"
          target="_blank"
          rel="noopener"
          aria-label="YouTube"
        >
          <svg
            viewBox="0 0 24 24"
            width="26"
            height="26"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M22 8.2c0-1.5-1.2-2.7-2.7-2.9C17.4 5 12 5 12 5s-5.4 0-7.3.3C3.2 5.5 2 6.7 2 8.2 1.8 9.7 1.8 12 1.8 12s0 2.3.2 3.8c0 1.5 1.2 2.7 2.7 2.9C6.6 19 12 19 12 19s5.4 0 7.3-.3c1.5-.2 2.7-1.4 2.7-2.9.2-1.5.2-3.8.2-3.8s0-2.3-.2-3.8z"
            />
            <path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none" />
          </svg>
        </a>
      </div>
      <p>&copy; <span id="year"></span> Restored Church Worldwide</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@23.0.12/build/js/intlTelInput.min.js"></script>
    <script src="/js/contact.js"></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
